<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/8_coin/coin_1.png">
    <link rel="stylesheet" href="./style.css">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/moveable-object/moveable-object.class.js"></script>
    <script src="./models/moveable-object/character.class.js"></script>
    <script src="./models/moveable-object/chicken.class.js"></script>
    <script src="./models/moveable-object/chicken-small.class.js"></script>
    <script src="./models/moveable-object/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/background/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/moveable-object/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./js/game.js"></script>
</head>

<body onload="init()">

    <h1>El Polo Loco</h1>

    <canvas id="canvas" width="720" height="480"></canvas>

    <section class="controls-hint" aria-label="Spielsteuerung">
        <div class="control-item">
            <span class="key">←</span>
            <span class="key">→</span>
            <span>Laufen</span>
        </div>
        <div class="control-item">
            <span class="key">↑</span>
            <span class="key key-wide">Leertaste</span>
            <span>Springen</span>
        </div>
        <div class="control-item">
            <span class="key">D</span>
            <span>Flasche werfen</span>
        </div>
    </section>

    <button id="start-button" class="start-button" type="button" onclick="startGame()" aria-label="Spiel starten">
        <img src="img/9_intro_outro_screens/start/image.png" alt="Start">
    </button>
</body>

</html>
